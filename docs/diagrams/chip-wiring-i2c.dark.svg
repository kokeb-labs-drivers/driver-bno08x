<text x="573" y="667.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R3 10 kΩ</text>
<text x="50" y="746.5" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="770" font-size="17" fill="#FECDD3">+3V3: VDD, VDDIO; also U2.VDD · GND: CLKSEL0, GND, PS0/WAKE, PS1, SA0/H_MOSI; also U2.GND</text>
<text x="50" y="839.5" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="863" font-size="17" fill="#E2E8F0">Support parts: 3 capacitors, 5 resistors, 1 other part around the supplies (values in the full schematic). Not wired in this circuit (1):</text>
<text x="50" y="887.6" font-size="17" fill="#E2E8F0">H_CSN.</text>
<text x="32" y="933.6" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: R1: the data sheet gives no value; size it for the bus; R2: the data sheet gives no value; size it for the bus;</text>
<text x="32" y="956.7" font-size="16" fill="#9AA6B5">R4: the data sheet gives no value for the environmental bus; R5: the data sheet gives no value for the environmental bus.</text>
