<title id="one-sample-through-the-layers-title">One sample through the layers</title>
<desc id="one-sample-through-the-layers-desc">One sensor sample: your code enables a feature, the core writes it through your port, the hub pulls its interrupt line low when data is ready, and the next Poll reads, reassembles and decodes the report into an event.</desc>
