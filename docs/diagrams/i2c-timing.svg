<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1335" viewBox="0 0 640 1335" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-timing-title">I2C timing of a read</title>
<desc id="i2c-timing-desc">I2C timing of a BNO08x read: H_INTN low asks for attention, the host sends a start, the address with the read bit and gets the acknowledge, H_INTN rises after the address, and the read ends with a NAK and a stop.</desc>
