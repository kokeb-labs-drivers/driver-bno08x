<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1274" viewBox="0 0 1200 1274" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the BNO08x does</title>
<desc id="chip-capabilities-desc">Capability map of the BNO08x: Orientation (supported): Rotation vector, game, geomagnetic, AR/VR stabilised and gyro-integrated quaternions, with accuracy; Motion outputs (supported): Acceleration, linear acceleration, gravity, angular rate and magnetic field, calibrated or raw; Activity and gestures (supported): Step counter, tap, shake, stability, significant motion and activity classifier as events; Rates, batching and timestamps (supported): A report rate per sensor, batched reports flushed on request, each with its own timestamp; Calibration (supported): Dynamic calibration on or off per sensor, saved to flash on request or periodically; Tare and reorientation (supported): Zeroes the heading or the full orientation, or rotates every output to the way the board is mounted; Configuration records (supported): Reads, writes and erases the records in the hub's flash, and each sensor's metadata; Reset, sleep and identity (supported): Resets the hub by pin or command, puts it to sleep and wakes it, and reads the product ID; Firmware update (not covered): The bootloader that writes new hub firmware; the driver never starts it.</desc>
