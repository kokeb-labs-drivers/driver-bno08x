<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="793" viewBox="0 0 1200 793" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">BNO08x</title>
<desc id="chip-hero-desc">Overview of the BNO08x, a 9-axis sensor hub in one package: an accelerometer, a gyroscope and a magnetometer with a Cortex-M0+ that runs the sensor fusion and reports finished orientation, motion and activity results to the host. A MCU talks to it over I2C, SPI or UART; it drives H_INTN line; it reads back Motion and magnetic field. Headline figures: 9 axes accelerometer, gyroscope, magnetometer; 1000 Hz gyro rotation vector; 400 Hz rotation vector; 3.7 ms rotation vector latency at 200 Hz; 3 MHz SPI; I2C 400 kHz, UART 3 Mbit/s; 2.4 to 3.6 V VDD; VDDIO 1.7 to 3.6 V; 5.2 x 3.8 mm LGA-28 body, 1.1 mm high.</desc>
