<text x="240" y="686" font-size="17" fill="#2B3442">vector; 400 Hz</text>
<text x="240" y="708.9" font-size="17" fill="#2B3442">rotation vector</text>
<text x="240" y="744.2" font-size="16" fill="#566070">6.9, p. 50</text>
<text x="432" y="633.4" font-size="30" font-weight="700" fill="#0E1726">3.7 ms</text>
<text x="432" y="663" font-size="17" fill="#2B3442">rotation vector</text>
<text x="432" y="686" font-size="17" fill="#2B3442">latency at 200</text>
<text x="432" y="708.9" font-size="17" fill="#2B3442">Hz</text>
<text x="432" y="744.2" font-size="16" fill="#566070">6.8, p. 50</text>
<text x="624" y="633.4" font-size="30" font-weight="700" fill="#0E1726">3 MHz</text>
<text x="624" y="663" font-size="17" fill="#2B3442">SPI; I2C 400</text>
<text x="624" y="686" font-size="17" fill="#2B3442">kHz, UART 3</text>
<text x="624" y="708.9" font-size="17" fill="#2B3442">Mbit/s</text>
<text x="624" y="744.2" font-size="16" fill="#566070">6.5.2, p. 47</text>
<text x="816" y="627.8" font-size="23" font-weight="700" fill="#0E1726">2.4 to 3.6 V</text>
<text x="816" y="663" font-size="17" fill="#2B3442">VDD; VDDIO 1.7</text>
<text x="816" y="686" font-size="17" fill="#2B3442">to 3.6 V</text>
<text x="816" y="744.2" font-size="16" fill="#566070">6.2, p. 45</text>
<text x="1008" y="626.2" font-size="21" font-weight="700" fill="#0E1726">5.2 x 3.8 mm</text>
<text x="1008" y="663" font-size="17" fill="#2B3442">LGA-28 body,</text>
<text x="1008" y="686" font-size="17" fill="#2B3442">1.1 mm high</text>
