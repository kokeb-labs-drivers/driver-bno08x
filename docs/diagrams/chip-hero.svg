<text x="48" y="633.4" font-size="30" font-weight="700" fill="#0E1726">9 axes</text>
<text x="48" y="663" font-size="17" fill="#2B3442">accelerometer,</text>
<text x="48" y="686" font-size="17" fill="#2B3442">gyroscope,</text>
<text x="48" y="708.9" font-size="17" fill="#2B3442">magnetometer</text>
<text x="48" y="744.2" font-size="16" fill="#566070">Title page, p. 1</text>
