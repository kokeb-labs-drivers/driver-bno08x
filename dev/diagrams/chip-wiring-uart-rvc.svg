<text x="273.7" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="493.7" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">UART RX</text>
<text x="726.3" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">H_SDA/H_MISO/TX</text>
<rect x="690.3" y="274.3" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="601" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">UART_TX  pin 20</text>
<text x="601" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">transport hooks</text>
