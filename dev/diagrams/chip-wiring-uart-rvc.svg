<rect x="690.3" y="531.1" width="14" height="12" rx="2" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="601" y="527.1" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">BOOTN  pin 4</text>
<text x="601" y="559.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">SetBootn()</text>
<text x="601" y="581.5" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R3 10 kΩ</text>
<text x="50" y="660.9" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="684.3" font-size="17" fill="#9F1239">+3V3: VDD, VDDIO; also U2.VDD · GND: CLKSEL0, GND, PS1; also U2.GND</text>
<text x="50" y="753.9" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="777.4" font-size="17" fill="#334155">Support parts: 3 capacitors, 3 resistors, 1 other part around the supplies (values in the full schematic). Not wired in this circuit</text>
<text x="50" y="802" font-size="17" fill="#334155">(4): H_CSN, H_INTN, SA0/H_MOSI, H_SCL/SCK/RX.</text>
<text x="32" y="848" font-size="16" fill="#566070">* Not confirmed in the datasheet: R4: the data sheet gives no value for the environmental bus; R5: the data sheet gives no value for the</text>
<text x="32" y="871.1" font-size="16" fill="#566070">environmental bus.</text>
