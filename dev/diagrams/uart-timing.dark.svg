<title id="uart-timing-title">UART-SHTP character</title>
<desc id="uart-timing-desc">One UART-SHTP character from the BNO08x: H_INTN falls shortly before the start bit, eight data bits follow least significant first and the stop bit, and H_INTN rises before the transmission ends.</desc>
