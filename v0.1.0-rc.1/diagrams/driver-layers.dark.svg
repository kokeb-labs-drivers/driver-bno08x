<rect x="32" y="699.6" width="796" height="111" rx="12" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="707.6" width="4" height="95" rx="2" fill="#2BB3A3"/>
<rect x="32" y="874.6" width="796" height="89" rx="12" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="32" y="882.6" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="868" y="302.4" width="300" height="128.3" rx="12" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<rect x="868" y="699.6" width="300" height="103.6" rx="12" fill="#0F2A28" stroke="#215A54" stroke-width="1"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#A7F3E6">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">a handler, a manager or a test</text>
<rect x="48" y="370.6" width="76" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">Begin()</text>
<rect x="132" y="370.6" width="116" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="140" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">HardReset()</text>
<rect x="255.9" y="370.6" width="75.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="263.9" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">Reset()</text>
<rect x="339.8" y="370.6" width="86.3" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="347.8" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">HubOn()</text>
<rect x="434.1" y="370.6" width="109.3" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="442.1" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">HubSleep()</text>
<rect x="551.4" y="370.6" width="119.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="559.4" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">SetFeature()</text>
<rect x="679.3" y="370.6" width="121.5" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="687.3" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">GetFeature()</text>
<rect x="48" y="404.6" width="74" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">Flush()</text>
<rect x="130" y="404.6" width="151.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="138" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">ReadProductId()</text>
<rect x="289.7" y="404.6" width="149.1" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="297.7" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">ReadMetadata()</text>
<rect x="446.8" y="404.6" width="96.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="454.8" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">ReadFrs()</text>
<rect x="551.8" y="404.6" width="100.6" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="559.8" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">WriteFrs()</text>
<rect x="660.3" y="404.6" width="101.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="668.3" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">EraseFrs()</text>
<rect x="48" y="438.6" width="67" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="456.7" font-size="16" font-weight="700" fill="#F8D27A">Tare()</text>
<rect x="123" y="438.6" width="124.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="131" y="456.7" font-size="16" font-weight="700" fill="#F8D27A">PersistTare()</text>
<rect x="255.7" y="438.6" width="167.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="263.7" y="456.7" font-size="16" font-weight="700" fill="#F8D27A">SetReorientation()</text>
<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">Bno08x, inc/bno08x.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="581.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="612.2" font-size="17" fill="#D2DAE4">HubInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="734.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="763.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  NowUs()  I2cWrite()  I2cRead()  IntAsserted() </text>
<text x="56" y="787" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SpiTransfer()</text>
<text x="56" y="909.6" font-size="20" font-weight="700" fill="#E2E8F0">Bno08x</text>
<text x="56" y="940.2" font-size="17" fill="#D2DAE4">the chip, on the I2C, SPI or UART bus</text>
<rect x="322.9" y="502.6" width="214.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="520.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">register reads and writes</text>
<rect x="329.6" y="655.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="673.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="317" y="830.6" width="226" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="848.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">I2C, SPI or UART transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="734.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="758.1" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="782.7" font-size="17" fill="#A7F3E6">board.</text>
<rect x="32" y="976" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="990.6" font-size="16" fill="#9AA6B5">you write</text>
<rect x="152.3" y="976" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="174.3" y="990.6" font-size="16" fill="#9AA6B5">this library</text>
<rect x="282.1" y="976" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="990.6" font-size="16" fill="#9AA6B5">hardware</text>
<path d="M404.1 984L434.1 984" fill="none" stroke="#6C7889" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="990.6" font-size="16" fill="#9AA6B5">calls</text>
</svg>
